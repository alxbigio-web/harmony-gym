<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harmony Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&text=%E2%99%AD%E2%99%AF%E2%99%AE&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root {
  /* Layout: nav rail (desktop) or bottom tab bar (phone) around one working "stage" per drill.
     Colour is reserved for the degree spectrum: flat side cool, sharp side warm, ordered by the circle of fifths. */
  --bg: oklch(97.2% 0.007 262);
  --panel: oklch(99.6% 0.002 262);
  --panel-2: oklch(94.8% 0.011 262);
  --panel-3: oklch(91.5% 0.014 262);
  --ink: oklch(24% 0.03 268);
  --ink-2: oklch(44% 0.025 268);
  --ink-3: oklch(58% 0.02 268);
  --line: oklch(88.5% 0.013 262);
  --btn: oklch(27% 0.035 268);
  --btn-ink: oklch(98.5% 0.004 262);
  --focus: oklch(58% 0.17 255);
  --good: oklch(54% 0.14 150);
  --good-bg: oklch(93.5% 0.05 150);
  --bad: oklch(55% 0.19 27);
  --bad-bg: oklch(94.5% 0.035 27);
  --warn: oklch(62% 0.13 70);
  --chip-l: 82%;
  --chip-c: 0.125;
  --chip-ink: oklch(23% 0.03 268);
  --key-white: oklch(99.5% 0.002 262);
  --key-white-edge: oklch(83% 0.012 262);
  --key-black: oklch(26% 0.022 268);
  --key-black-edge: oklch(16% 0.02 268);
  --shadow: 0 1px 2px oklch(20% 0.03 268 / 0.06), 0 8px 28px oklch(20% 0.03 268 / 0.07);
  --display: "Bricolage Grotesque", "Noto Music", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Figtree", "Noto Music", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "Noto Music", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 16px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(16.5% 0.018 272);
    --panel: oklch(20.5% 0.02 272);
    --panel-2: oklch(24.5% 0.022 272);
    --panel-3: oklch(28.5% 0.024 272);
    --ink: oklch(94.5% 0.008 268);
    --ink-2: oklch(77% 0.014 268);
    --ink-3: oklch(62% 0.015 268);
    --line: oklch(31% 0.022 272);
    --btn: oklch(92% 0.012 268);
    --btn-ink: oklch(19% 0.025 272);
    --focus: oklch(72% 0.14 255);
    --good: oklch(74% 0.14 150);
    --good-bg: oklch(30% 0.06 150);
    --bad: oklch(70% 0.16 27);
    --bad-bg: oklch(30% 0.07 27);
    --warn: oklch(78% 0.12 75);
    --chip-l: 77%;
    --chip-c: 0.12;
    --chip-ink: oklch(19% 0.03 272);
    --key-white: oklch(88% 0.008 268);
    --key-white-edge: oklch(55% 0.012 268);
    --key-black: oklch(13% 0.012 272);
    --key-black-edge: oklch(8% 0.01 272);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 8px 28px oklch(0% 0 0 / 0.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(16.5% 0.018 272);
  --panel: oklch(20.5% 0.02 272);
  --panel-2: oklch(24.5% 0.022 272);
  --panel-3: oklch(28.5% 0.024 272);
  --ink: oklch(94.5% 0.008 268);
  --ink-2: oklch(77% 0.014 268);
  --ink-3: oklch(62% 0.015 268);
  --line: oklch(31% 0.022 272);
  --btn: oklch(92% 0.012 268);
  --btn-ink: oklch(19% 0.025 272);
  --focus: oklch(72% 0.14 255);
  --good: oklch(74% 0.14 150);
  --good-bg: oklch(30% 0.06 150);
  --bad: oklch(70% 0.16 27);
  --bad-bg: oklch(30% 0.07 27);
  --warn: oklch(78% 0.12 75);
  --chip-l: 77%;
  --chip-c: 0.12;
  --chip-ink: oklch(19% 0.03 272);
  --key-white: oklch(88% 0.008 268);
  --key-white-edge: oklch(55% 0.012 268);
  --key-black: oklch(13% 0.012 272);
  --key-black-edge: oklch(8% 0.01 272);
  --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 8px 28px oklch(0% 0 0 / 0.28);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: inherit; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.eyebrow { font: 600 11.5px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: 100dvh; display: flex; flex-direction: column; gap: 22px;
  padding-block: 22px 18px; padding-right: 14px; padding-left: max(18px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--line); background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; font: 750 19px/1 var(--display); letter-spacing: -0.02em; }
.brand svg { flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px;
  text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14.5px;
}
.nav a:hover { background: var(--panel-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.nav a svg { width: 18px; height: 18px; flex: none; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.status-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-status {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 8px; border-radius: 99px;
  background: var(--panel-2); color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap;
  border: 0; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.chip-status .t-short { display: none; }
.chip-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.chip-status.on .dot { background: var(--good); }
.chip-status.warn .dot { background: var(--warn); }

.topbar, .tabbar { display: none; }
main {
  min-width: 0;
  padding-block: 26px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.view { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.view-head h1 { font-size: 30px; line-height: 1.1; }
.view-head .sub { color: var(--ink-2); margin-top: 4px; max-width: 62ch; }

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .topbar {
    display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in {
    display: flex; align-items: center; gap: 10px; min-height: 52px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar .brand { font-size: 17px; margin-right: auto; white-space: nowrap; }
  .topbar .chip-status .t { display: none; }
  .topbar .chip-status .t-short { display: inline; }
  .topbar .icon-btn { width: 36px; height: 36px; }
  .tabbar {
    display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabbar-in {
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .tabbar a {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px;
    text-decoration: none; color: var(--ink-3); font-size: 11px; font-weight: 600;
  }
  .tabbar a svg { width: 21px; height: 21px; }
  .tabbar a[aria-current="page"] { color: var(--ink); }
  main { padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
  .view-head h1 { font-size: 25px; }
  .hide-phone { display: none !important; }
}
@media (min-width: 900px) { .hide-desk { display: none !important; } }

/* ---------- Controls ---------- */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 14px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font: 600 14px/1.15 var(--body); cursor: pointer;
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--panel-2); color: var(--ink); }
.btn.big { min-height: 52px; padding: 12px 22px; font-size: 16px; border-radius: 14px; }
.btn.small { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 9px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn kbd { margin-left: 2px; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .key:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--panel-2); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
kbd {
  font: 500 11px/1.5 var(--mono); padding: 0 5px; border-radius: 5px; border: 1px solid var(--line);
  border-bottom-width: 2px; color: var(--ink-3); background: var(--panel);
}
.btn.primary kbd { background: transparent; color: inherit; opacity: 0.7; border-color: currentColor; }

.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--panel-2); gap: 2px; flex-wrap: wrap; }
.seg button {
  appearance: none; border: 0; background: transparent; padding: 7px 13px; border-radius: 9px;
  font-weight: 650; font-size: 14px; color: var(--ink-2); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px oklch(20% 0.03 268 / 0.12); }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
select, input[type="text"], input[type="date"], input[type="number"], textarea {
  appearance: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 32px 8px 11px; min-height: 40px; font-size: 14px; max-width: 100%;
}
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer;
}
input[type="text"], input[type="date"], textarea { padding-right: 11px; }
textarea { width: 100%; resize: vertical; font: 12px/1.45 var(--mono); min-height: 84px; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; user-select: none; }
.toggle input { appearance: none; width: 36px; height: 21px; border-radius: 99px; background: var(--panel-3); position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px oklch(0% 0 0 / 0.25); transition: transform .15s; }
.toggle input:checked { background: var(--btn); }
.toggle input:checked::after { transform: translateX(15px); background: var(--btn-ink); }
input[type="range"] { accent-color: var(--btn); width: 100%; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.toolbar .grow { flex: 1 1 auto; }

/* ---------- Cards ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card h2 { font-size: 18px; }
.card h3 { font-size: 15.5px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 899px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.note { font-size: 13.5px; color: var(--ink-2); }
.callout {
  display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: 12px;
  background: var(--panel-2); color: var(--ink-2); font-size: 14px;
}
.callout strong { color: var(--ink); }
.callout svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--ink-3); }

/* ---------- Stage ---------- */
.stage {
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
.stage-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.stage-key { font: 700 15px/1.2 var(--body); color: var(--ink-2); }
.stage-key b { font: 750 26px/1.1 var(--display); color: var(--ink); display: block; letter-spacing: -0.015em; }
.stage-status { font-size: 15px; color: var(--ink-2); min-height: 1.5em; }
.stage-status.good { color: var(--good); font-weight: 650; }
.stage-status.bad { color: var(--bad); font-weight: 650; }
.stage-center { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0; text-align: center; }
.stage-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.big-symbol { font: 750 clamp(44px, 9vw, 76px)/1 var(--display); letter-spacing: -0.03em; }
.big-sub { font-size: 15px; color: var(--ink-2); }
.timer { font: 600 22px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.session-strip { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.session-strip b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.start-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 0 8px; text-align: center; }
.start-wrap p { max-width: 46ch; color: var(--ink-2); }
.shortcuts { font-size: 12.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; }

/* ---------- Degree colours ---------- */
.deg-chip {
  --h: 195;
  display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 9px;
  background: oklch(calc(var(--chip-l) + var(--lb, 0%)) var(--chip-c) var(--h)); color: var(--chip-ink);
  font: 750 15px/1 var(--display);
}
.deg-chip.xl { min-width: 104px; height: 104px; border-radius: 28px; font-size: 52px; padding: 0 18px; }
.deg-chip.lg { min-width: 56px; height: 56px; border-radius: 16px; font-size: 26px; }
.deg-chip.unknown { background: var(--panel-2); color: var(--ink-3); border: 2px dashed var(--line); }

.pad { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 7px; }
.pad .row-black { display: contents; }
.pad button {
  --h: 195; appearance: none; border: 0; cursor: pointer; border-radius: 13px;
  background: oklch(calc(var(--chip-l) + var(--lb, 0%)) var(--chip-c) var(--h)); color: var(--chip-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 62px; padding: 6px 2px; font: 750 23px/1 var(--display); position: relative;
  transition: transform .08s ease, box-shadow .15s ease, opacity .15s;
  grid-column: span 2;
}
.pad button.black { min-height: 48px; font-size: 18px; }
.pad button small { font: 600 11px/1 var(--body); opacity: 0.66; letter-spacing: 0.02em; }
.pad button:hover { transform: translateY(-1px); }
.pad button:active { transform: translateY(1px); }
.pad button.off { background: var(--panel-2); color: var(--ink-3); cursor: default; transform: none; }
.pad button.sel { box-shadow: 0 0 0 3px var(--ink) inset; }
.pad button.good { box-shadow: 0 0 0 3px var(--good), 0 0 0 6px var(--good-bg); }
.pad button.bad { box-shadow: 0 0 0 3px var(--bad), 0 0 0 6px var(--bad-bg); }
.pad button.hint { box-shadow: 0 0 0 3px var(--good) inset; }
.pad button kbd { position: absolute; top: 5px; right: 6px; font-size: 9.5px; padding: 0 3px; border: 0; background: transparent; color: inherit; opacity: 0.5; }
.pad-spacer { grid-column: span 1; }
@media (max-width: 520px) {
  .pad { gap: 5px; }
  .pad button { min-height: 54px; font-size: 20px; border-radius: 11px; }
  .pad button.black { min-height: 42px; font-size: 15px; }
  .pad button kbd { display: none; }
}

.answer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.answer-grid button {
  appearance: none; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  min-height: 54px; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  transition: transform .08s ease, box-shadow .15s;
}
.answer-grid button b { font: 750 20px/1.05 var(--display); }
.answer-grid button small { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.answer-grid button:hover { background: var(--panel-2); }
.answer-grid button.good { box-shadow: 0 0 0 3px var(--good); background: var(--good-bg); }
.answer-grid button.bad { box-shadow: 0 0 0 3px var(--bad); background: var(--bad-bg); }
.answer-grid button.hint { box-shadow: 0 0 0 3px var(--good) inset; }
.answer-grid.numerals { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }

.slots { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.slot {
  width: 84px; height: 72px; border-radius: 14px; border: 2px dashed var(--line); display: grid; place-items: center;
  font: 750 24px/1 var(--display); background: var(--panel); cursor: pointer; color: var(--ink);
}
.slot.filled { border-style: solid; border-color: var(--panel-3); background: var(--panel-2); }
.slot.current { border-color: var(--ink-3); }
.slot.good { border: 2px solid var(--good); background: var(--good-bg); }
.slot.bad { border: 2px solid var(--bad); background: var(--bad-bg); }
.slot small { display: block; font: 600 11px/1.2 var(--body); color: var(--ink-3); margin-top: 3px; text-align: center; }
@media (max-width: 520px) { .slot { width: 64px; height: 60px; font-size: 19px; } .slots { gap: 7px; } }

/* ---------- Piano ---------- */
.piano-scroll { overflow-x: auto; overscroll-behavior-x: contain; border-radius: 12px; padding-bottom: 4px; }
.piano { position: relative; display: flex; height: 168px; user-select: none; touch-action: manipulation; min-width: 100%; }
.piano .key { position: relative; border: 0; padding: 0; cursor: pointer; appearance: none; font: inherit; }
.piano .white {
  flex: 1 0 30px; height: 100%; background: var(--key-white); border: 1px solid var(--key-white-edge); border-left-width: 0;
  border-radius: 0 0 7px 7px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 7px; gap: 3px;
}
.piano .white:first-child { border-left-width: 1px; }
.piano .black {
  position: absolute; top: 0; height: 60%; background: var(--key-black); border: 1px solid var(--key-black-edge);
  border-radius: 0 0 5px 5px; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px; gap: 2px;
}
.piano .key .lbl { font: 600 10px/1 var(--mono); color: var(--ink-3); pointer-events: none; }
.piano .black .lbl { color: oklch(70% 0.01 268); }
.piano .key .tag {
  --h: 195; pointer-events: none; min-width: 22px; height: 22px; border-radius: 7px; padding: 0 4px; display: grid; place-items: center;
  background: oklch(calc(var(--chip-l) + var(--lb, 0%)) var(--chip-c) var(--h)); color: var(--chip-ink); font: 750 11.5px/1 var(--display);
}
.piano .key.down.white { background: var(--panel-3); }
.piano .key.down.black { background: oklch(40% 0.03 268); }
.piano .key.wrong .tag { background: var(--bad); color: var(--btn-ink); }
.piano .key.ghost .tag { background: transparent; border: 2px dashed var(--ink-3); color: var(--ink-2); }
.piano .key.ghost.down .tag { background: oklch(calc(var(--chip-l) + var(--lb, 0%)) var(--chip-c) var(--h)); border: 0; color: var(--chip-ink); }
@media (max-width: 899px) { .piano { height: 150px; } }

/* ---------- Meter (singing) ---------- */
.meter { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 6px; }
.meter-track { position: relative; height: 46px; border-radius: 12px; background: var(--panel-2); overflow: hidden; }
.meter-zone { position: absolute; top: 0; bottom: 0; background: var(--good-bg); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
.meter-center { position: absolute; top: 6px; bottom: 6px; left: 50%; width: 2px; margin-left: -1px; background: var(--good); opacity: 0.6; }
.meter-dot {
  position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
  background: var(--ink); transition: left .08s linear, opacity .2s; box-shadow: 0 0 0 4px color-mix(in oklch, var(--ink) 18%, transparent);
}
.meter-dot.idle { opacity: 0.18; }
.meter-scale { display: flex; justify-content: space-between; font: 500 11px/1 var(--mono); color: var(--ink-3); }
.hold-bar { height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.hold-bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .08s linear; }
.sing-readout { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--ink-2); min-height: 34px; }
.sing-readout .cents { font: 600 15px var(--mono); }
.trace-wrap { width: 100%; }
.trace-wrap canvas { width: 100%; height: 260px; display: block; border-radius: 14px; background: var(--panel-2); }

/* ---------- Stats ---------- */
.ladder { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.ladder .tile {
  --h: 195; --a: 0.15; border-radius: 11px; padding: 8px 4px 7px; text-align: center; display: flex; flex-direction: column; gap: 3px; align-items: center;
  background: oklch(calc(var(--chip-l) + var(--lb, 0%)) var(--chip-c) var(--h) / var(--a)); border: 1px solid oklch(calc(var(--chip-l) + var(--lb, 0%)) var(--chip-c) var(--h) / 0.6);
}
.ladder .tile b { font: 750 18px/1 var(--display); }
.ladder .tile span { font: 600 11px/1.1 var(--mono); color: var(--ink-2); }
.ladder .tile em { font: 500 10.5px/1.1 var(--mono); color: var(--ink-3); font-style: normal; }
.ladder-axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
@media (max-width: 640px) { .ladder { grid-template-columns: repeat(6, minmax(0, 1fr)); } .ladder-axis { display: none; } }

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(64px, 108px) minmax(0, 1fr) 92px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar-row .lab { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 10px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 99px; background: var(--ink-2); }
.bar-row .val { font: 500 12px var(--mono); color: var(--ink-2); text-align: right; white-space: nowrap; }

.heat-wrap { overflow-x: auto; }
.heat { border-collapse: separate; border-spacing: 3px; font-size: 12px; }
.heat th { font-weight: 650; color: var(--ink-2); padding: 2px 4px; white-space: nowrap; text-align: left; }
.heat th.k { text-align: center; font-family: var(--display); font-size: 13px; }
.heat td { width: 38px; height: 30px; border-radius: 7px; text-align: center; font: 500 11px var(--mono); background: var(--panel-2); color: var(--ink-3); }
.heat td.has { color: var(--chip-ink); }

.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); grid-auto-columns: 13px; justify-content: start; gap: 3px; overflow-x: auto; padding: 3px; }
.cal i { width: 13px; height: 13px; border-radius: 3px; background: var(--panel-2); }
.cal i[data-l="1"] { background: oklch(var(--chip-l) var(--chip-c) 170 / 0.45); }
.cal i[data-l="2"] { background: oklch(var(--chip-l) var(--chip-c) 160 / 0.75); }
.cal i[data-l="3"] { background: oklch(calc(var(--chip-l) - 14%) calc(var(--chip-c) + 0.02) 150); }
.cal i.today { outline: 2px solid var(--ink-3); outline-offset: 1px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; display: flex; flex-direction: column; gap: 3px; }
.kpi b { font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.confusions { display: flex; flex-wrap: wrap; gap: 8px; }
.conf { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 10px; background: var(--panel-2); font-size: 13px; }
.conf .deg-chip { height: 24px; min-width: 24px; font-size: 13px; border-radius: 7px; }

/* ---------- Today / plan ---------- */
.hero { display: flex; flex-direction: column; gap: 14px; }
.hero h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.02; letter-spacing: -0.025em; }
.hero .phase-name { color: var(--ink-2); font-weight: 600; }
.weeks { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.weeks i { height: 8px; border-radius: 99px; background: var(--panel-3); }
.weeks i.done { background: var(--ink-3); }
.weeks i.now { background: var(--ink); }
.weeks-labels { display: grid; grid-template-columns: 3fr 3fr 3fr 3fr; gap: 4px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }

.blocks { display: flex; flex-direction: column; gap: 10px; }
.block {
  display: grid; grid-template-columns: 116px minmax(0, 1fr) auto; gap: 8px 18px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 15px 16px;
}
.block-name { display: flex; flex-direction: column; gap: 3px; }
.block-name b { font: 700 17px/1.1 var(--display); }
.block-name span { font: 500 12.5px var(--mono); color: var(--ink-3); }
.block-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.block-body p { color: var(--ink-2); font-size: 14.5px; }
.block .progress { height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; max-width: 340px; }
.block .progress i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.block .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.block.done { background: color-mix(in oklch, var(--good-bg) 45%, var(--panel)); }
.manual { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.manual input[type="text"] { flex: 1 1 200px; min-width: 0; }
@media (max-width: 720px) {
  .block { grid-template-columns: minmax(0, 1fr); }
  .block .actions { justify-content: flex-start; }
}

.phases { display: flex; flex-direction: column; gap: 14px; }
.phase { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; }
.phase.current { border-color: var(--ink-3); box-shadow: var(--shadow); }
.phase-meta { display: flex; flex-direction: column; gap: 6px; }
.phase-meta b { font: 750 21px/1.1 var(--display); }
.phase-tasks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
.phase-tasks div { display: flex; flex-direction: column; gap: 2px; }
.phase-tasks .eyebrow { margin-bottom: 1px; }
.phase-tasks p { font-size: 14px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 650; background: var(--panel-2); color: var(--ink-2); width: fit-content; }
.pill.now { background: var(--btn); color: var(--btn-ink); }
@media (max-width: 720px) { .phase { grid-template-columns: minmax(0, 1fr); } .phase-tasks { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Settings ---------- */
.set-list { display: flex; flex-direction: column; gap: 14px; }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 8px 20px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; padding-top: 0; }
.set-row .lbl b { display: block; font-weight: 650; }
.set-row .lbl span { font-size: 13px; color: var(--ink-2); }
.set-row .ctl { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.set-row .ctl select, .set-row .ctl input[type="text"] { width: 100%; }
@media (max-width: 640px) { .set-row { grid-template-columns: minmax(0, 1fr); } .set-row .ctl { justify-content: flex-start; } }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); font-size: 14px; }
ol.steps b { color: var(--ink); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--btn); color: var(--btn-ink);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}
@media (max-width: 899px) { .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }

.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--bad-bg); }
.empty { padding: 18px; border-radius: 14px; border: 1px dashed var(--line); color: var(--ink-2); font-size: 14px; text-align: center; }

@keyframes pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
.pop { animation: pop .28s ease; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>

// Close-position voicing nearest to the previous one (simple voice leading)
function voiceLead(pcs, prev, lo = 55, hi = 77) {

    for (let base = lo; base <= hi; base++) {
      if (mod12(base) !== order[0]) continue;
      const notes = [base];
      for (let i = 1; i < n; i++) { let m = notes[i - 1] + 1; while (mod12(m) !== order[i]) m++; notes.push(m); }
      if (notes[n - 1] <= hi) cands.push(notes);

    let k = Math.abs(centre(c) - 66) * 0.35;
    if (prev) for (const m of c) k += Math.min(...prev.map(p => Math.abs(p - m)));

  };

}

function genProgression(level) {

// ---------------- Scale-degree drill ----------------
function DegreeDrill() {

  const sess = { n: 0, c: 0, ms: [] };

  const status = statusLine();

  const cadBtn = h('button', { type: 'button', class: 'btn', onclick: () => replayCadence() }, 'Cadence', h('kbd', null, 'C'));
  const nextBtn = h('button', { type: 'button', class: 'btn primary', onclick: () => ask() }, 'Next', h('kbd', null, '↵'));

      q.sel.push(id); pad.mark(id, 'sel');
      if (q.sel.length < 2) return;
      const ok = q.degs.every(d => q.sel.includes(d));
      for (const d of q.degs) record(q.cat, d, q.sel.includes(d), ok ? rt : null);

    destroy() { token++; unsub(); offMidi(); offSettings(); AudioEngine.stopAll(); AudioEngine.stopDrone(); },
    onKey(e) {

      if (e.code === 'Enter') { e.preventDefault(); ask(); return true; }
      if (e.code === 'KeyC' && !e.metaKey && !e.ctrlKey) { replayCadence(); return true; }

}

// ---------------- Chord-quality drill ----------------
function ChordDrill() {
  let level = CHORD_LEVELS.find(l => l.id === Settings.get().chordLevel) || CHORD_LEVELS[1];
  let q = null, token = 0, started = false, last = null;
  const sess = { n: 0, c: 0, ms: [] };

  function renderGrid() {

    playNote.textContent = play ? (MidiIO.input ? 'Play the chord you hear on your keyboard, root in the bass. Any voicing and octave works; the 5th is optional.' : 'Tap the notes of the chord on the keyboard, root lowest. Connect a MIDI keyboard to play it for real.') : '';
    level.q.forEach((k, i) => grid.append(h('button', { type: 'button', 'data-q': k, onclick: () => answer(k) }, h('b', null, QUAL[k].sym || 'maj'), h('small', null, `${i + 1} · ${QUAL[k].name}`))));
  }
  function updateStrip() { strip.update([['This session', `${sess.c}/${sess.n}`], ['Accuracy', fmtPct(sess.n ? sess.c / sess.n : null)], ['Median time', fmtSec(median(sess.ms))]]); }
  function notesFor(rootPc, qual) { const bass = 36 + mod12(rootPc); return QUAL[qual].play.map(i => bass + i); }

    last = qual;

// ---------------- Progression drill ----------------
function ProgressionDrill() {
  let level = PROG_LEVELS.find(l => l.id === Settings.get().progLevel) || PROG_LEVELS[0];
  let q = null, token = 0, started = false, lastKey = null, needRelease = false;
  const sess = { n: 0, c: 0 };
  const keyLine = h('div', { class: 'stage-key' }, 'Ready', h('b', null, 'Progressions'));
  const status = statusLine();
  const center = h('div', { class: 'stage-center' });
  const grid = h('div', { class: 'answer-grid numerals', role: 'group', 'aria-label': 'Roman numerals' });
  const strip = sessionStrip();
  const nextBtn = h('button', { type: 'button', class: 'btn primary', onclick: () => ask() }, 'Next', h('kbd', null, '↵'));
  const undoBtn = h('button', { type: 'button', class: 'btn', onclick: () => undo() }, 'Undo', h('kbd', null, '⌫'));
  const actions = h('div', { class: 'stage-actions' },
    h('button', { type: 'button', class: 'btn', onclick: () => replay() }, icon('replay'), 'Replay', h('kbd', null, 'Space')),
    h('button', { type: 'button', class: 'btn', onclick: () => replay(true) }, 'With cadence', h('kbd', null, 'C')), undoBtn, nextBtn);
  actions.hidden = true;
  const levelSel = levelControls(PROG_LEVELS, level.id, v => { level = PROG_LEVELS.find(l => l.id === v); Settings.set({ progLevel: v }); renderGrid(); if (started) ask(); }, l => `${l.name} · ${l.blurb}`);
  const [keyMode, fixedKey] = keyControls(() => { if (started) ask(); });
  const midiNote = h('p', { class: 'note' });
  const stage = h('section', { class: 'stage', 'aria-label': 'Progression drill' }, h('div', { class: 'stage-top' }, keyLine, status), center, actions, grid, strip);
  const el = h('div', { style: 'display:flex;flex-direction:column;gap:16px' }, h('div', { class: 'toolbar' }, levelSel, keyMode, fixedKey), stage, midiNote,
    shortcutRow([['Space', 'replay'], ['C', 'with cadence'], ['⌫', 'undo'], ['↵', 'next']]));

  function renderGrid() {
    grid.replaceChildren(...level.opts.map(n => h('button', { type: 'button', 'data-n': n, onclick: () => answer(n) }, h('b', null, NUMERALS[n].label), NUM_HINT[n] ? h('small', null, NUM_HINT[n]) : null)));
    midiNote.textContent = MidiIO.input ? 'You can also play each chord on your keyboard, root in the bass. The app works out which numeral you played.' : '';
  }
  function updateStrip() { strip.update([['This session', `${sess.c}/${sess.n} progressions`], ['Chords right', `${sess.chords || 0}/${sess.n * 4}`]]); }
  function voicings(keyPc, nums) {
    let prev = null, prevBass = null;
    return nums.map(n => {
      const N = NUMERALS[n], rootPc = mod12(keyPc + N.root), qual = level.sevenths ? N.q7 : N.q;
      const pcs = qualPcs(rootPc, qual);
      const upper = voiceLead(pcs, prev, 55, 76);
      let bass = 36 + rootPc; if (prevBass != null && bass - prevBass > 6) bass -= 12; if (bass < 33) bass += 12;
      prev = upper; prevBass = bass;
      return [bass, ...upper];
    });
  }
  function playProg(t, withCadence) {
    if (withCadence) t = AudioEngine.playCadence(q.keyPc, false, t) + 0.25;
    const gap = AudioEngine.cadenceGap() * 1.6;
    q.chords.forEach((ch, i) => AudioEngine.chord(ch, t + i * gap, gap * 0.95, 0.58));
    return t;
  }
  function slotsView() {
    const wrap = h('div', { class: 'slots', 'aria-label': 'Your answer' });
    for (let i = 0; i < 4; i++) {
      const n = q.sel[i];
      let cls = 'slot' + (n ? ' filled' : '') + (i === q.sel.length && !q.finished ? ' current' : '');
      if (q.finished) cls += q.sel[i] === q.nums[i] ? ' good' : ' bad';
      const slot = h('button', { type: 'button', class: cls, 'aria-label': `Chord ${i + 1}`, onclick: () => playOne(i) }, n ? NUMERALS[n].label : '');
      wrap.append(slot);
    }
    if (q.finished && !q.correct) wrap.append(h('p', { class: 'note', style: 'width:100%' }, 'Answer: ', q.nums.map(n => NUMERALS[n].label).join(' – '), ` in ${ROOT_NAMES[q.keyPc]}: `, q.nums.map(n => chordSym(mod12(q.keyPc + NUMERALS[n].root), level.sevenths ? NUMERALS[n].q7 : NUMERALS[n].q)).join(' – ')));
    return wrap;

  async function ask() {
    const my = ++token; started = true;
    try { await AudioEngine.init(); } catch (e) { status.set(e.message, 'bad'); return; }
    if (my !== token) return;
    AudioEngine.stopAll();
    const keyPc = keyFor(lastKey); lastKey = keyPc;
    const nums = genProgression(level);
    q = { keyPc, nums, sel: [], finished: false };
    q.chords = voicings(keyPc, nums);
    for (const b of grid.children) b.classList.remove('good', 'bad');
    keyLine.replaceChildren(document.createTextNode('Key'), h('b', null, keyName(keyPc, false)));
    center.replaceChildren(slotsView()); actions.hidden = false; nextBtn.hidden = true; undoBtn.hidden = false;
    status.set('Listen to the cadence, then the four chords…');
    const t = playProg(AudioEngine.t0(0.08), true);
    await AudioEngine.until(t);
    if (my !== token) return;
    status.set('Enter the four chords.');
  }
  function replay(withCadence) { if (!q) return ask(); AudioEngine.stopAll(); playProg(AudioEngine.t0(0.05), !!withCadence); }
  function undo() { if (!q || q.finished || !q.sel.length) return; q.sel.pop(); center.replaceChildren(slotsView()); }
  function answer(n) {
    if (!q || q.finished) return;
    q.sel.push(n); Activity.count('ear');
    if (q.sel.length === 4) {
      q.finished = true;
      let right = 0;
      q.nums.forEach((t, i) => { const ok = q.sel[i] === t; if (ok) right++; record('prg', t, ok, null); if (!ok) recordConfusion('prg', t, q.sel[i]); });
      q.correct = right === 4;
      sess.n++; if (q.correct) sess.c++; sess.chords = (sess.chords || 0) + right;
      updateStrip();
      status.set(q.correct ? 'All four right.' : `${right} of 4 right. Tap a chord to hear it.`, q.correct ? 'good' : 'bad');
      nextBtn.hidden = false; undoBtn.hidden = true;
      if (q.correct && Settings.get().autoNext) { const my = token; setTimeout(() => { if (my === token) ask(); }, 1500); }
    }
    center.replaceChildren(slotsView());
  }
  function identify(notes) {
    if (notes.length < 3) return null;
    const pcs = new Set(notes.map(mod12)), bass = mod12(notes[0]);
    for (const n of level.opts) {
      const N = NUMERALS[n], root = mod12(q.keyPc + N.root);
      if (root !== bass) continue;
      const triad = qualPcs(root, N.q).slice(0, 3);

  }
  const unsub = MidiIO.subscribe(() => {
    if (!q || q.finished) return;
    const notes = MidiIO.heldNotes();
    if (!notes.length) { needRelease = false; return; }
    if (needRelease) return;
    clearTimeout(q.idTimer);

      const n = identify(MidiIO.heldNotes());
      if (!n) return;

      needRelease = true; answer(n);
    }, 140);
  });
  DEBUG.prog = () => q;
  renderGrid(); updateStrip();
  center.replaceChildren(startPanel('Start', 'A cadence sets the key, then you hear four chords. Write them down as Roman numerals.', () => ask()));
  const offMidi = Bus.on('midi', renderGrid);
  return {
    el,
    destroy() { token++; unsub(); offMidi(); AudioEngine.stopAll(); },
    onKey(e) {
      if (e.code === 'Space') { e.preventDefault(); if (!started || q?.finished) ask(); else replay(); return true; }
      if (e.code === 'Enter') { e.preventDefault(); ask(); return true; }
      if (e.code === 'KeyC') { replay(true); return true; }
      if (e.code === 'Backspace') { undo(); return true; }
      return false;
    },
  };
}

function EarView(sub) {
  const tabs = [['degrees', 'Degrees'], ['chords', 'Chord qualities'], ['progressions', 'Progressions']];
  let current = tabs.some(t => t[0] === sub) ? sub : 'degrees';
  let drill = null;
  const body = h('div');
  const seg = segmented(tabs, current, v => show(v), 'Ear training type');
  const el = h('div', { class: 'view' },
    h('div', { class: 'view-head' }, h('div', null, h('h1', null, 'Ear training'), h('p', { class: 'sub' }, 'Hear each note as a scale degree in a key, then move on to chord colours and whole progressions.')), seg),
    body);
  function show(id) {
    drill?.destroy();
    current = id; seg.setValue(id);
    try { history.replaceState(null, '', '#ear-' + id); } catch { /* sandboxed */ }
    drill = id === 'chords' ? ChordDrill() : id === 'progressions' ? ProgressionDrill() : DegreeDrill();
    body.replaceChildren(drill.el);
  }
  show(current);
  return { el, destroy() { drill?.destroy(); }, onKey(e) { return drill?.onKey?.(e); } };
}


/* =====================================================================
   Voicing trainer

const ROOTLESS = {

      cancelAnimationFrame(raf);
    }
  }
  function onPitch(p) {
    const now = performance.now();
    pts.push({ t: now, m: p.midi });
    while (pts.length && now - pts[0].t > 8000) pts.shift();
    if (!on) return;
    if (p.midi == null) { big.replaceChildren(h('span', { class: 'faint' }, 'Listening…')); return; }
    if (now - lastTouch > 2000) { Activity.touch('sing'); lastTouch = now; }
    const semi = Math.round(p.midi) - keyPc;
    const d = degBySemi(semi);
    const c = (p.midi - Math.round(p.midi)) * 100;
    big.replaceChildren(degChip(d.id, 'xl'), h('div', { class: 'sing-readout' }, h('span', { class: 'cents' }, `${c > 0 ? '+' : ''}${Math.round(c)}¢`), h('span', { class: 'faint' }, noteName(Math.round(p.midi)))));
    if (pattern && patIdx < pattern.seq.length) {
      const target = DEG[pattern.seq[patIdx]];
      const cc = centsTo(p.midi, mod12(keyPc + target.semi));
      if (Math.abs(cc) <= Settings.get().singTol) {
        patHold += 33;
        if (patHold >= 300) {
          if (!patStart) patStart = now;
          record('sng', target.id, true, now - stepStart, { cents: Math.abs(cc) });
          patIdx++; patHold = 0; stepStart = now;
          renderPattern();
          if (patIdx >= pattern.seq.length) {
            status.set(`Pattern done in ${fmtSec(now - patStart)}. Starting it again.`, 'good');
            setTimeout(() => setPattern(pattern.id), 1200);
          }
        }
      } else patHold = Math.max(0, patHold - 40);
    }
  }
  function loop() {
    draw();
    if (on) raf = requestAnimationFrame(loop);
  }
  function draw() {
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, hgt = canvas.clientHeight;
    if (!w) return;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(hgt * dpr); }
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, hgt);
    const L = cssVar('--chip-l') || '80%', C = cssVar('--chip-c') || '0.12', ink = cssVar('--ink'), ink3 = cssVar('--ink-3');
    const recent = pts.filter(p => p.m != null).slice(-40).map(p => p.m);
    const centre = recent.length ? median(recent) : refMidi(keyPc) + 4;
    const lo = centre - 9.5, hi = centre + 9.5;
    const y = m => hgt - (m - lo) / (hi - lo) * hgt;
    g.font = '600 11px ' + (cssVar('--mono') || 'monospace');
    for (let m = Math.ceil(lo); m <= Math.floor(hi); m++) {
      const d = degBySemi(m - keyPc), dia = MAJOR_DEGS.includes(d.id);
      { const hue = hueForSemi(d.semi); g.strokeStyle = `oklch(${(parseFloat(L) + lumBump(hue)).toFixed(1)}% ${C} ${hue} / ${dia ? 0.75 : 0.22})`; }
      g.lineWidth = d.id === '1' ? 2.5 : dia ? 1.4 : 1;
      g.beginPath(); g.moveTo(34, y(m)); g.lineTo(w, y(m)); g.stroke();
      g.fillStyle = dia ? ink : ink3;
      g.fillText(d.label, 8, y(m) + 4);
    }
    const now = performance.now();
    g.strokeStyle = ink; g.lineWidth = 3; g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath();
    let prev = null;
    for (const p of pts) {
      const x = 34 + (w - 34) * (1 - (now - p.t) / 8000);
      if (p.m == null) { prev = null; continue; }
      if (prev && Math.abs(prev.m - p.m) < 1.5) g.lineTo(x, y(p.m)); else g.moveTo(x, y(p.m));
      prev = p;
    }
    g.stroke();
    const last = pts.length ? pts[pts.length - 1] : null;
    if (last && last.m != null) { g.fillStyle = ink; g.beginPath(); g.arc(w - 6, y(last.m), 6, 0, Math.PI * 2); g.fill(); }
  }
  offPitch = Mic.listen(onPitch);
  big.replaceChildren(h('span', { class: 'faint' }, 'Start the drone, then sing.'));
  requestAnimationFrame(draw);
  return {
    el,
    destroy() { on = false; cancelAnimationFrame(raf); offPitch?.(); mic.destroy?.(); AudioEngine.stopDrone(); },
    onKey(e) { if (e.code === 'Space') { e.preventDefault(); toggle(); return true; } return false; },
  };
}

function currentWeek() { return Math.floor(dayDiff(Store.state.plan.start, dayKey()) / 7) + 1; }

function suggestEar(phase) {

  for (const id of e.levels) {

// Degree ladder in circle-of-fifths order (flat side → sharp side)
function degreeLadder(cat, compact) {
  const tiles = FIFTHS_ORDER.map(d => {
    const a = agg(cat, d.id);
    const acc = a.recentAcc ?? a.acc;
    return h('div', { class: 'tile', style: { ...hueVars(d.semi), '--a': a.n ? (0.25 + 0.75 * (acc ?? 0)).toFixed(2) : '0.08' }, title: `${d.label}: ${a.n} tries` },
      h('b', null, d.label),
      h('span', null, a.n ? fmtPct(acc) : '–'),
      compact ? null : h('em', null, a.avgMs != null ? fmtSec(a.avgMs) : (a.n ? '' : 'no data')));
  });
  const anyData = FIFTHS_ORDER.some(d => agg(cat, d.id).n);
  return h('div', null,
    h('div', { class: 'ladder' }, tiles),
    h('div', { class: 'ladder-axis' }, h('span', null, '← darker (flat side)'), h('span', null, 'brighter (sharp side) →')),
    anyData ? null : h('p', { class: 'note', style: 'margin-top:10px' }, 'Fills in as you answer. Tile strength shows accuracy over your last 20 tries.'));
}

// ---------------- App shell ----------------
const NAV = [['today', 'Today'], ['ear', 'Ear'], ['voicings', 'Voicings'], ['sing', 'Sing'], ['stats', 'Progress'], ['plan', 'Plan'], ['settings', 'Settings']];
const TABS = ['today', 'ear', 'voicings', 'sing', 'stats'];
const VIEWS = { today: TodayView, ear: EarView, voicings: VoicingsView, sing: SingView, stats: StatsView, plan: PlanView, settings: SettingsView };
const App = {
  view: null, route: 'today', main: null,
  mount() {
    const navLink = (id, label) => h('a', { href: '#' + id, 'data-route': id }, icon(id), h('span', null, label));
    const midiChip = () => h('button', { type: 'button', class: 'chip-status', 'data-chip': 'midi', onclick: () => this.midiChipClick() }, h('span', { class: 'dot' }), h('span', { class: 't' }, ''));
    const saveChip = () => h('button', { type: 'button', class: 'chip-status', 'data-chip': 'save', onclick: () => go('settings-sync') }, h('span', { class: 'dot' }), h('span', { class: 't' }, ''), h('span', { class: 't-short' }, ''));

      h('div', { class: 'brand' }, brandMark(28), 'Harmony Gym'),
      h('nav', { class: 'nav', 'aria-label': 'Main' }, NAV.map(([id, l]) => navLink(id, l))),
      h('div', { class: 'rail-foot' }, h('div', { class: 'status-row' }, midiChip()), h('div', { class: 'status-row' }, saveChip())));
    const topbar = h('header', { class: 'topbar' }, h('div', { class: 'topbar-in' },
      h('div', { class: 'brand' }, brandMark(24), 'Harmony Gym'),
      saveChip(),
      h('a', { class: 'icon-btn', href: '#plan', 'aria-label': 'Plan' }, icon('plan')),
      h('a', { class: 'icon-btn', href: '#settings', 'aria-label': 'Settings' }, icon('settings'))));
    this.main = h('main', { id: 'main' });
    const tabbar = h('nav', { class: 'tabbar', 'aria-label': 'Sections' }, h('div', { class: 'tabbar-in' }, TABS.map(id => navLink(id, NAV.find(n => n[0] === id)[1]))));

    document.getElementById('root').replaceChildren(app);
    addEventListener('hashchange', () => this.render());
    addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
      if (e.target.closest && e.target.closest('.piano') && (e.key === 'Enter' || e.key === ' ')) return;
      if (tag === 'button' && (e.code === 'Space' || e.code === 'Enter') && !e.target.closest('.pad')) { /* let the view decide */ }
      if (this.view?.onKey?.(e)) e.preventDefault();
    });

    Bus.on('save', () => this.updateChips());
    Bus.on('storage', () => { this.updateChips(); if (['today', 'stats', 'plan', 'settings'].includes(this.route)) this.render(); });
    Bus.on('remote', () => { if (['today', 'stats', 'plan'].includes(this.route)) this.render(); });
    this.render();
    this.updateChips();
  },
  async midiChipClick() {
    if (IN_CLAUDE || MidiIO.status === 'unsupported') { go('settings-midi'); return; }
    if (MidiIO.status !== 'ready') { await AudioEngine.init().catch(() => {}); await MidiIO.connect(); if (MidiIO.status === 'ready') toast(MidiIO.input ? `Connected: ${MidiIO.input.name}` : 'MIDI is on, but no keyboard was found.'); return; }
    go('settings-midi');
  },
  updateChips() {
    const ml = MidiIO.label();

    if (!sub) scrollTo(0, 0);
    document.title = 'Harmony Gym';
  },
};
